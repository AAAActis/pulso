version: '3.8'

# Production deployment for Pulso API on Arch Linux
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  pulso-api:
    image: ghcr.io/aaaactis/pulso:latest
    container_name: pulso-api
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: '0.5'
    ports:
      - "127.0.0.1:5002:8080"
    volumes:
      - ./data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Data Source=/data/pulso.db;Cache=Shared;Mode=ReadWriteCreate;Pooling=true
      - Redis__Configuration=${REDIS_CONNECTION:-}
      - Cors__AllowedOrigin=${CORS_ALLOWED_ORIGIN:-https://s-portfolio.bbasolutions.ar}
      - RateLimit__GlobalPermitLimit=60
      - RateLimit__LabPermitLimit=5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
      start_interval: 5s
    networks:
      - arch-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arch-net:
    external: true
    name: arch-net

# Volumes managed externally (./data bind mount)
# No named volumes needed - SQLite file lives in ./data bind mount